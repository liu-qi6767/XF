<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线音乐播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .player-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .current-song {
            text-align: center;
            margin-bottom: 20px;
        }

        .album-cover {
            width: 200px;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .song-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
        }

        .song-artist {
            font-size: 1.2em;
            color: #666;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .control-btn.play-pause {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .song-list {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .song-list h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .song-item:hover {
            background: #f5f5f5;
        }

        .song-item.active {
            background: #667eea;
            color: white;
        }

        .song-item-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 15px;
        }

        .song-item-info {
            flex: 1;
        }

        .song-item-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .song-item-artist {
            color: #999;
            font-size: 0.9em;
        }

        .song-item.active .song-item-artist {
            color: rgba(255,255,255,0.8);
        }

        .song-item-duration {
            color: #999;
        }

        .song-item.active .song-item-duration {
            color: rgba(255,255,255,0.8);
        }

        .sheet-music-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .sheet-music-btn:hover {
            background: #218838;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .album-cover {
                width: 150px;
                height: 150px;
            }

            .song-item {
                flex-direction: column;
                text-align: center;
            }

            .song-item-cover {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 在线音乐播放器</h1>

        <div class="player-container">
            <div class="current-song">
                <img id="albumCover" class="album-cover" src="https://via.placeholder.com/200?text=No+Song" alt="封面">
                <div class="song-title" id="songTitle">请选择歌曲</div>
                <div class="song-artist" id="songArtist">-</div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-pause" id="playPauseBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <audio id="audioPlayer"></audio>
        </div>

        <div class="song-list">
            <h2>播放列表</h2>
            <div id="songList">
                <div class="empty-message">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // GitHub 配置
        const GITHUB_USER = 'liu-qi6767';
        const GITHUB_REPO = 'XF';
        const GITHUB_BRANCH = 'main';

        // jsDelivr CDN 基础 URL（用于音频和图片）
        const CDN_BASE = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${GITHUB_BRANCH}`;

        // 歌曲数据 URL（使用 GitHub Pages 自己的域名，不用 CDN）
        const SONGS_JSON_URL = `https://liu-qi6767.github.io/XF/data/songs.json`;

        let songs = [];
        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const albumCover = document.getElementById('albumCover');
        const songListEl = document.getElementById('songList');

        // 加载歌曲列表
        async function loadSongs() {
            try {
                const response = await fetch(SONGS_JSON_URL + '?t=' + Date.now());
                songs = await response.json();

                if (songs.length > 0) {
                    renderSongList();
                    loadSong(0);
                } else {
                    songListEl.innerHTML = '<div class="empty-message">暂无歌曲<br><small>请联系管理员添加歌曲</small></div>';
                }
            } catch (error) {
                console.error('加载歌曲失败:', error);
                songListEl.innerHTML = '<div class="empty-message">加载失败<br><small>请刷新页面重试</small></div>';
            }
        }

        // 渲染歌曲列表
        function renderSongList() {
            songListEl.innerHTML = songs.map((song, index) => `
                <div class="song-item ${index === currentSongIndex ? 'active' : ''}" onclick="playSong(${index})">
                    <img class="song-item-cover" src="${song.cover || 'https://via.placeholder.com/60?text=Cover'}" alt="封面">
                    <div class="song-item-info">
                        <div class="song-item-title">${song.title}</div>
                        <div class="song-item-artist">${song.artist}</div>
                    </div>
                    <span class="song-item-duration">${song.duration || '0:00'}</span>
                    ${song.sheetMusic ? `<button class="sheet-music-btn" onclick="event.stopPropagation(); viewSheetMusic('${song.sheetMusic}')">查看歌谱</button>` : ''}
                </div>
            `).join('');
        }

        // 加载歌曲
        function loadSong(index) {
            if (songs.length === 0) return;
            currentSongIndex = index;
            const song = songs[index];

            audioPlayer.src = song.url;
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            albumCover.src = song.cover || 'https://via.placeholder.com/200?text=Cover';

            renderSongList();
        }

        // 播放歌曲
        function playSong(index) {
            loadSong(index);
            audioPlayer.play();
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        }

        // 播放/暂停
        playPauseBtn.addEventListener('click', () => {
            if (songs.length === 0) return;

            if (isPlaying) {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                audioPlayer.play();
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // 上一首
        prevBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSong(currentSongIndex);
        });

        // 下一首
        nextBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            playSong(currentSongIndex);
        });

        // 自动播放下一首
        audioPlayer.addEventListener('ended', () => {
            nextBtn.click();
        });

        // 更新进度条
        audioPlayer.addEventListener('timeupdate', () => {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        });

        // 更新总时长
        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        // 进度条点击
        progressBar.addEventListener('click', (e) => {
            if (songs.length === 0) return;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 查看歌谱
        function viewSheetMusic(sheetMusicUrl) {
            window.open(sheetMusicUrl, '_blank');
        }

        // 初始化
        loadSongs();
    </script>
</body>
</html>
