<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>先锋诗歌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .player-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .current-song {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
        }

        .song-artist {
            font-size: 1.2em;
            color: #666;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            background: transparent;
            color: #667eea;
            border: 3px solid #667eea;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.play-pause {
            width: 70px;
            height: 70px;
            font-size: 28px;
            border-width: 3px;
        }

        .sheet-music-btn {
            background: transparent;
            color: #28a745;
            border: 3px solid #28a745;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.3s;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .sheet-music-btn:hover {
            background: #28a745;
            color: white;
            transform: scale(1.05);
        }

        .sheet-music-btn:active {
            transform: scale(0.95);
        }

        .sheet-music-btn.visible {
            display: flex;
        }

        .sheet-music-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .sheet-music-modal.active {
            display: flex;
        }

        .sheet-music-content {
            width: 90%;
            height: 90%;
            background: white;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        .sheet-music-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .close-sheet-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s;
            z-index: 10001;
        }

        .close-sheet-btn:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .song-list {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .song-list h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
            background: white;
        }

        .song-item:hover {
            background: #f5f5f5;
        }

        .song-item.active {
            background: #667eea;
            color: white;
        }

        .song-item-cover {
            display: none;
        }

        .song-item-info {
            flex: 1;
            text-align: left;
        }

        .song-item-title {
            font-weight: bold;
            font-size: 1.1em;
            text-align: left;
        }

        .song-item-artist {
            display: none;
        }

        .song-item-duration {
            color: #999;
            font-size: 1em;
            margin-left: 15px;
        }

        .song-item.active .song-item-duration {
            color: rgba(255,255,255,0.8);
        }

        /* 手机端特殊样式 */
        @media (max-width: 768px) {
            .song-list {
                padding: 20px 15px;
            }

            .song-item {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 12px 15px;
                text-align: left;
            }

            .song-item-info {
                flex: 1;
                text-align: left;
                padding-right: 10px;
            }

            .song-item-title {
                text-align: left;
                width: 100%;
                display: block;
                font-size: 1em;
            }

            .song-item-duration {
                text-align: right;
                flex-shrink: 0;
                min-width: 50px;
            }

            h1 {
                font-size: 1.5em;
            }
        }

        .sheet-music-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s;
        }

        .sheet-music-btn:hover {
            background: #218838;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .album-cover {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 先锋诗歌</h1>

        <div class="player-container">
            <div class="current-song">
                <div class="song-title" id="songTitle">请选择歌曲</div>
                <div class="song-artist" id="songArtist">-</div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prevBtn">⏮</button>
                <button class="control-btn play-pause" id="playPauseBtn">▶</button>
                <button class="control-btn" id="nextBtn">⏭</button>
                <button class="sheet-music-btn" id="sheetMusicBtn" title="查看歌谱">📄</button>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <audio id="audioPlayer"></audio>
        </div>

        <!-- 歌谱全屏悬浮层 -->
        <div class="sheet-music-modal" id="sheetMusicModal">
            <div class="sheet-music-content">
                <button class="close-sheet-btn" onclick="closeSheetMusic()">✕</button>
                <img id="sheetMusicImage" src="" alt="歌谱">
            </div>
        </div>

        <div class="song-list">
            <h2>播放列表</h2>
            <div id="songList">
                <div class="empty-message">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // GitHub 配置
        const GITHUB_USER = 'liu-qi6767';
        const GITHUB_REPO = 'XF';
        const GITHUB_BRANCH = 'main';

        // 使用 jsDelivr CDN 加速（文件名已改为英文，不会被浏览器阻止）
        const CDN_BASE = `https://cdn.jsdelivr.net/gh/${GITHUB_USER}/${GITHUB_REPO}@${GITHUB_BRANCH}`;

        // 歌曲数据 URL（也使用 CDN）
        const SONGS_JSON_URL = `${CDN_BASE}/data/songs.json`;

        let songs = [];
        let currentSongIndex = 0;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const albumCover = document.getElementById('albumCover');
        const songListEl = document.getElementById('songList');

        // 加载歌曲列表
        async function loadSongs() {
            try {
                const response = await fetch(SONGS_JSON_URL + '?t=' + Date.now());
                songs = await response.json();

                if (songs.length > 0) {
                    renderSongList();
                    loadSong(0);
                } else {
                    songListEl.innerHTML = '<div class="empty-message">暂无歌曲<br><small>请联系管理员添加歌曲</small></div>';
                }
            } catch (error) {
                console.error('加载歌曲失败:', error);
                songListEl.innerHTML = '<div class="empty-message">加载失败<br><small>请刷新页面重试</small></div>';
            }
        }

        // 渲染歌曲列表
        function renderSongList() {
            songListEl.innerHTML = songs.map((song, index) => `
                <div class="song-item ${index === currentSongIndex ? 'active' : ''}" onclick="playSong(${index})">
                    <div class="song-item-info">
                        <div class="song-item-title">${song.title}</div>
                    </div>
                    <span class="song-item-duration">${song.duration || '0:00'}</span>
                </div>
            `).join('');
        }

        // 加载歌曲
        function loadSong(index) {
            if (songs.length === 0) return;
            currentSongIndex = index;
            const song = songs[index];

            audioPlayer.src = song.url;
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;

            // 更新查看歌谱按钮显示状态
            const sheetMusicBtn = document.getElementById('sheetMusicBtn');
            if (song.sheetMusic) {
                sheetMusicBtn.classList.add('visible');
                sheetMusicBtn.onclick = () => openSheetMusic(song.sheetMusic);
            } else {
                sheetMusicBtn.classList.remove('visible');
            }

            renderSongList();
        }

        // 播放歌曲
        function playSong(index) {
            loadSong(index);
            audioPlayer.play();
            isPlaying = true;
            playPauseBtn.textContent = '⏸';
        }

        // 播放/暂停
        playPauseBtn.addEventListener('click', () => {
            if (songs.length === 0) return;

            if (isPlaying) {
                audioPlayer.pause();
                playPauseBtn.textContent = '▶';
            } else {
                audioPlayer.play();
                playPauseBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        });

        // 上一首
        prevBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSong(currentSongIndex);
        });

        // 下一首
        nextBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            playSong(currentSongIndex);
        });

        // 自动播放下一首
        audioPlayer.addEventListener('ended', () => {
            nextBtn.click();
        });

        // 更新进度条
        audioPlayer.addEventListener('timeupdate', () => {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        });

        // 更新总时长
        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        // 进度条点击
        progressBar.addEventListener('click', (e) => {
            if (songs.length === 0) return;
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        // 格式化时间
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 查看歌谱
        function openSheetMusic(sheetMusicUrl) {
            const modal = document.getElementById('sheetMusicModal');
            const image = document.getElementById('sheetMusicImage');
            image.src = sheetMusicUrl;
            modal.classList.add('active');
        }

        function closeSheetMusic() {
            const modal = document.getElementById('sheetMusicModal');
            modal.classList.remove('active');
        }

        // 点击背景关闭
        document.getElementById('sheetMusicModal').addEventListener('click', (e) => {
            if (e.target.id === 'sheetMusicModal') {
                closeSheetMusic();
            }
        });

        // 初始化
        loadSongs();
    </script>
</body>
</html>
